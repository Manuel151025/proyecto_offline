version: 2

# El lint de Android reporta 16 avisos de dependencias desactualizadas y las
# acciones del CI ya quedaron obsoletas una vez (Node 20). Actualizar a mano
# solo funciona mientras alguien se acuerde; esto lo vuelve rutina.
updates:
  # Android: Compose, Room, Hilt, Retrofit…
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    # Agrupadas para no recibir cinco PRs por la misma familia de librerías.
    groups:
      androidx:
        patterns:
          - "androidx.*"
      compose:
        patterns:
          - "androidx.compose*"
      hilt:
        patterns:
          - "com.google.dagger*"
          - "androidx.hilt*"

  # Acciones del workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"

  # PHPStan y futuras herramientas de análisis.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
