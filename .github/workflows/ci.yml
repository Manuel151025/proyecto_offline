name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela ejecuciones anteriores de la misma rama para no gastar minutos de más.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AGP 8.2 requiere JDK 17; con JDK 21 falla JdkImageTransform.
      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar pruebas unitarias
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee /tmp/gradle-test.log

      # Falla ante ERRORES, no ante avisos: los 16 avisos actuales son
      # "hay una versión más nueva", que es trabajo de Dependabot.
      - name: Analizar con Android Lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace --console=plain 2>&1 | tee /tmp/gradle-lint.log

      - name: Generar informe de cobertura
        run: ./gradlew informeCobertura --console=plain

      - name: Compilar APK de depuración
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/gradle-assemble.log

      # Publica el error como anotación del check. El contenido del log solo es
      # accesible con autenticación, mientras que las anotaciones son públicas:
      # así el motivo del fallo se ve desde el PR sin abrir la ejecución.
      #
      # Las líneas van numeradas con `nl` a propósito: GitHub deduplica
      # anotaciones con el mismo texto y sin numerar se pierden las líneas
      # repetidas y el orden, que es justo donde está la causa raíz.
      - name: Publicar causa del fallo
        if: failure()
        run: |
          # :app:packageDebug falla de forma intermitente sin causa anidada, que
          # es lo que se ve cuando al proceso trabajador lo mata el sistema en
          # vez de fallar con una excepción.
          #
          # OJO al leer esto: disco y memoria se miden AQUÍ, después de que
          # Gradle murió, así que la memoria ya está liberada y un valor alto
          # NO descarta que el pico la agotara. La prueba de verdad es el
          # registro del kernel: si el OOM killer actuó, deja rastro.
          echo "::error::[disco] $(df -h / | tail -1 | tr -s ' ')"
          echo "::error::[memoria tras el fallo] $(free -m 2>/dev/null | grep Mem | tr -s ' ' || echo 'no disponible')"

          oom=$(sudo dmesg 2>/dev/null | grep -iE "out of memory|killed process|oom-kill" | tail -5 || true)
          if [ -n "$oom" ]; then
            echo "$oom" | while IFS= read -r l; do echo "::error::[OOM killer] $l"; done
          else
            echo "::error::[OOM killer] sin rastro en dmesg (o sin permiso para leerlo)"
          fi

          for archivo in /tmp/gradle-test.log /tmp/gradle-assemble.log; do
            [ -f "$archivo" ] || continue
            {
              sed -n '/FAILURE: Build failed/,$p' "$archivo" | head -30
              echo "--- excepción con traza ---"
              # La causa real cuelga de "* Exception is:", no del bloque
              # "What went wrong"; ayer se quedó fuera por el recorte.
              sed -n '/\* Exception is:/,$p' "$archivo" | head -25
              echo "--- causas anidadas ---"
              grep -E "Caused by|No space left|OutOfMemory|Killed" "$archivo" | head -10
            } | nl -ba | while IFS= read -r linea; do
                echo "::error::$linea"
              done
          done

      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: informes-android
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/jacoco/informeCobertura/html/
            app/build/reports/lint-results-debug.html
          retention-days: 7

  php:
    name: API · análisis estático y pruebas de integración
    runs-on: ubuntu-latest
    # MySQL real para las pruebas: la lógica que importa (Last-Write-Wins,
    # cursor de descarga, claves foráneas) vive en las consultas.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, curl

      - name: Validar sintaxis de todos los archivos PHP
        run: |
          set -e
          encontrados=0
          while IFS= read -r archivo; do
            php -l "$archivo"
            encontrados=$((encontrados + 1))
          done < <(find api -name '*.php' -type f)
          echo "✓ $encontrados archivos PHP validados"

      - name: Instalar herramientas de análisis
        run: composer install --no-interaction --no-progress --prefer-dist

      # `php -l` solo comprueba que el archivo parsee. Esto es análisis
      # estático de verdad: tipos, valores nulos, ramas inalcanzables.
      # El nivel 8 no es arbitrario: es el más alto que el código pasa limpio.
      - name: Analizar con PHPStan (nivel 8)
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      # Levantan el servidor embebido contra una base desechable y prueban la
      # API y el panel de punta a punta: sincronización, cursor de descarga,
      # validación, sesión del panel, CSV y cuentas.
      - name: Pruebas de integración (PHPUnit + MySQL)
        env:
          PRUEBAS_DB_HOST: 127.0.0.1
          PRUEBAS_DB_USER: root
          PRUEBAS_DB_PASS: root
        run: vendor/bin/phpunit --testdox

      # Solo llamadas reales a header(); los comentarios pueden mencionar el patrón.
      - name: Verificar que no quede CORS permisivo
        run: |
          if grep -rnE "header\(['\"]Access-Control-Allow-Origin:[[:space:]]*\*" api/; then
            echo "::error::Se encontró CORS permisivo (*). Usa aplicarCors() de api/cors.php."
            exit 1
          fi
          echo "✓ Sin CORS permisivo"

      - name: Verificar que los endpoints de escritura exijan autenticación
        run: |
          if ! grep -q "requerirAutenticacion" api/personas/sync.php; then
            echo "::error::api/personas/sync.php debe exigir un token de autenticación."
            exit 1
          fi
          echo "✓ Endpoint de sincronización protegido"

      - name: Verificar que el login limite los intentos
        run: |
          if ! grep -q "exigirLimiteIntentos" api/auth/login.php; then
            echo "::error::api/auth/login.php debe limitar los intentos fallidos (fuerza bruta)."
            exit 1
          fi
          echo "✓ Login con límite de intentos"

      - name: Verificar que el panel admin limite los intentos
        run: |
          # La URL del panel es pública, no pide usuario y quien entre puede
          # borrar personas. Sin límite se le puede probar contraseñas sin fin.
          if ! grep -q "segundosDeBloqueo" api/admin/index.php; then
            echo "::error::El panel admin debe comprobar el bloqueo por intentos fallidos."
            exit 1
          fi
          if ! grep -q "registrarIntentoFallido" api/admin/index.php; then
            echo "::error::El panel admin debe registrar los intentos fallidos, o el contador nunca sube."
            exit 1
          fi
          # El contador del panel se guarda bajo una clave con '#', imposible de
          # producir con la validación de documento de login.php. Si esa
          # validación desaparece, un cliente puede bloquear el panel desde fuera.
          if ! grep -q 'preg_match(.*A-Za-z0-9' api/auth/login.php; then
            echo "::error::login.php debe validar el formato del documento, o se puede bloquear el panel admin desde fuera."
            exit 1
          fi
          echo "✓ Panel admin con límite de intentos"

      - name: Verificar que el panel admin use cuentas con nombre
        run: |
          # La contraseña compartida no deja rastro de QUIÉN hizo qué. El panel
          # debe validar contra la tabla de cuentas con rol admin.
          if ! grep -q "buscarAdminPorDocumento" api/admin/index.php; then
            echo "::error::El panel admin debe autenticar contra cuentas con rol, no solo con ADMIN_PASSWORD."
            exit 1
          fi
          # ADMIN_PASSWORD solo puede valer mientras no exista ningún admin.
          if ! grep -q "modoArranque" api/admin/index.php; then
            echo "::error::ADMIN_PASSWORD debe aceptarse solo en modo arranque, o el secreto compartido nunca muere."
            exit 1
          fi
          # Y no debe poder uno dejarse fuera del panel.
          if ! grep -q "esUltimoAdminActivo" api/admin/index.php; then
            echo "::error::Hay que impedir quitar el rol o desactivar al último administrador activo."
            exit 1
          fi
          echo "✓ Panel admin con cuentas por rol"

      - name: Verificar que la descarga exija token y use el sello del servidor
        run: |
          if ! grep -q "requerirAutenticacion" api/personas/cambios.php; then
            echo "::error::api/personas/cambios.php expone datos de todos: debe exigir token."
            exit 1
          fi
          # Filtrar por updated_at rompería la descarga incremental: ese campo
          # lo pone el dispositivo y puede ir hacia atrás.
          if ! grep -q "server_updated_at > ?" api/personas/cambios.php; then
            echo "::error::La descarga debe filtrar por server_updated_at, no por updated_at."
            exit 1
          fi
          echo "✓ Descarga protegida y con marca de agua del servidor"

      - name: Verificar que el servidor valide el documento
        run: |
          # El documento es la clave primaria de personas. La validación del
          # cliente no protege nada: con un token y curl se salta. En producción
          # llegó a colarse una persona con documento "hola".
          if ! grep -q "documentoValidado" api/personas/sync.php; then
            echo "::error::sync.php debe validar el documento en el servidor, no fiarse del cliente."
            exit 1
          fi
          echo "✓ Documento validado en el servidor"

      - name: Verificar que un registro inválido no tumbe el lote entero
        run: |
          # Las validaciones por fila deben lanzar DatoInvalido, no llamar a
          # responderError, que hace exit. Si vuelven a abortar el envío, un
          # solo registro irreparable deja la cola de un encuestador bloqueada:
          # se reintenta el mismo lote en cada sincronización y falla igual.
          if ! grep -q "class DatoInvalido" api/personas/validacion.php; then
            echo "::error::sync.php debe descartar la fila inválida, no abortar el lote completo."
            exit 1
          fi
          if ! grep -q '"rechazadas"' api/personas/sync.php; then
            echo "::error::sync.php debe informar qué registros rechazó, o el cliente los reenvía siempre."
            exit 1
          fi
          # Y el cliente debe tener un estado terminal para no reintentarlos.
          if ! grep -q "RECHAZADO" app/src/main/java/com/minsalud/encuestas/data/local/dao/ColaSincronizacionDao.kt; then
            echo "::error::La cola de Android debe excluir los rechazados de los reintentos."
            exit 1
          fi
          echo "✓ Un registro inválido no bloquea la cola"

      - name: Verificar que el borrado de personas sea suave
        run: |
          # Un DELETE real quitaría la fila, y entonces cambios.php no tendría
          # nada que enviar: los celulares que ya la descargaron se la quedarían
          # para siempre, sin forma de corregirlo desde el servidor.
          if grep -qE "DELETE\s+FROM\s+personas" api/admin/consultas.php api/admin/index.php; then
            echo "::error::El borrado de personas debe ser suave (deleted_at), o los dispositivos nunca se enteran."
            exit 1
          fi
          if ! grep -q "function borrarPersona" api/admin/consultas.php; then
            echo "::error::Sin borrado en el panel no hay forma de retirar un registro que los clientes ya no pueden enviar."
            exit 1
          fi
          # Ambas deben sellar con la marca del servidor, o el cambio no se
          # reparte: la descarga filtra por server_updated_at, y los clientes
          # descartan por Last-Write-Wins lo que llegue con updated_at menor
          # que su copia local.
          for funcion in borrarPersona restaurarPersona; do
            cuerpo=$(grep -A 14 "function $funcion" api/admin/consultas.php)
            if ! echo "$cuerpo" | grep -q "server_updated_at"; then
              echo "::error::$funcion debe actualizar server_updated_at, o el cambio no se descarga."
              exit 1
            fi
            if ! echo "$cuerpo" | grep -q "updated_at = ?"; then
              echo "::error::$funcion debe actualizar updated_at, o los clientes lo descartan por Last-Write-Wins."
              exit 1
            fi
          done
          echo "✓ Borrado suave, restaurable y propagable"

      - name: Verificar que el cierre de sesión revoque el token
        run: |
          if [ ! -f api/auth/logout.php ] || ! grep -q "DELETE FROM sesiones" api/auth/logout.php; then
            echo "::error::Sin revocación, cerrar sesión deja el token válido 30 días en el servidor."
            exit 1
          fi
          echo "✓ Cierre de sesión con revocación"

      - name: Verificar cabeceras de seguridad y sesión del panel admin
        run: |
          for cabecera in X-Content-Type-Options X-Frame-Options Referrer-Policy; do
            if ! grep -q "$cabecera" api/cors.php; then
              echo "::error::Falta la cabecera $cabecera en api/cors.php"
              exit 1
            fi
          done
          if ! grep -q "session_regenerate_id" api/admin/index.php; then
            echo "::error::El panel admin debe regenerar el id de sesión al autenticar (fijación de sesión)."
            exit 1
          fi
          echo "✓ Cabeceras de seguridad y sesión del panel"

  pwa:
    name: PWA · integridad del modo offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verificar caché del service worker y manifest
        run: node scripts/check-pwa-assets.mjs

      # La paleta vive en design/tokens.json. Si alguien cambia un color a mano
      # en la PWA, el panel o Android, las tres superficies divergen en silencio.
      - name: Verificar que la paleta coincida con design/tokens.json
        run: node scripts/tokens.mjs --verificar

      # Municipios (DIVIPOLA) y EPS viven en database/catalogos/. Si alguien edita
      # a mano la copia de la PWA, de Android, del servidor o de schema.sql,
      # un teléfono volvería a quedarse con una lista distinta a la del servidor.
      - name: Verificar que los catálogos coincidan con database/catalogos/
        run: node scripts/catalogos.mjs --verificar

      # El huso se fija a propósito: el fallo que motivó estas pruebas (la fecha
      # de nacimiento corriéndose un día) solo se manifestaba con desfase
      # negativo respecto a UTC, y Colombia es donde corre la app.
      - name: Ejecutar pruebas de la PWA
        env:
          TZ: America/Bogota
        run: node --test pwa/tests/*.test.mjs

      # Se repiten con desfase positivo: una conversión de fecha correcta no
      # puede depender del huso de la máquina.
      - name: Repetir las pruebas con otro huso horario
        env:
          TZ: Asia/Tokyo
        run: node --test pwa/tests/*.test.mjs

      # Los módulos ES no se pueden validar con `node --check` tal cual, hay que
      # presentarlos con extensión .mjs para que Node los trate como módulos.
      - name: Validar sintaxis de los módulos JavaScript
        run: |
          set -e
          tmp=$(mktemp -d)
          n=0
          while IFS= read -r archivo; do
            cp "$archivo" "$tmp/$(basename "${archivo%.js}").mjs"
            node --check "$tmp/$(basename "${archivo%.js}").mjs"
            n=$((n + 1))
          done < <(find pwa -name '*.js' -type f)
          echo "✓ $n módulos validados"

  e2e:
    name: Punta a punta · panel y app en un navegador real
    runs-on: ubuntu-latest
    # Recorre lo que hace una persona: crea cuentas en el panel, entra a la
    # app, registra sin señal, recupera la señal y comprueba que el registro
    # llegó al panel. Usa una base y un servidor desechables.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring

      # Node 22 trae WebSocket nativo, con el que se controla el navegador
      # sin instalar Playwright ni Puppeteer.
      - name: Configurar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Pruebas de punta a punta
        env:
          PRUEBAS_DB_HOST: 127.0.0.1
          PRUEBAS_DB_USER: root
          PRUEBAS_DB_PASS: root
          NAVEGADOR: /usr/bin/google-chrome
          CAPTURAS: capturas-e2e
          TZ: America/Bogota
        run: node --test tests/e2e/e2e.test.mjs

      - name: Publicar capturas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: capturas-e2e
          path: capturas-e2e/
          retention-days: 7
