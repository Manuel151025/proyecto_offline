# Memoria del demonio de Gradle.
#
# El job de Android encadena cuatro invocaciones (pruebas, lint, cobertura y
# empaquetado) sobre el MISMO demonio, y era siempre la última la que moría.
# Gradle reportaba "A failure occurred while executing
# PackageAndroidArtifact$IncrementalSplitterRunnable" sin ninguna causa
# anidada, que es lo que se ve cuando al proceso trabajador lo mata el sistema
# operativo en vez de fallar con una excepción propia.
#
# MaxMetaspaceSize es la clave: el metaspace crece con cada compilación y NO
# lo limita -Xmx, porque es memoria nativa. Sin tope, cuatro invocaciones
# seguidas lo hacen crecer hasta que el sistema mata el proceso; y como no es
# una excepción de Java, no queda traza. Ponerle techo obliga a recolectar en
# vez de seguir reservando.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# El compilador de Kotlin corre en su propio demonio, con memoria aparte de la
# de Gradle. Sin límite explícito reserva un porcentaje de la RAM de la
# máquina, que en el runner son 16 GB.
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m

# Menos trabajadores en paralelo: baja el pico de memoria durante el dexing y
# el empaquetado, que es justo donde fallaba. En un proyecto de un solo módulo
# el paralelismo ahorra poco tiempo y consume bastante.
org.gradle.workers.max=2

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
