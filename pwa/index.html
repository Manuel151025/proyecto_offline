<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="ColOffline: encuestas demográficas que funcionan sin conexión" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ColOffline" />

  <title>ColOffline</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <!-- El orden importa: la cascada de CSS depende de él. Estos archivos salieron
       de un styles.css de 791 líneas y concatenados en este orden lo reproducen. -->
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/forms.css" />
  <link rel="stylesheet" href="./css/sync.css" />
  <link rel="stylesheet" href="./css/feedback.css" />
  <link rel="stylesheet" href="./css/login.css" />
</head>
<body>
  <div id="app-shell">
    <header class="app-header">
      <div class="app-brand">
        <svg class="app-logo" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18" fill="#12467E"/><rect x="15" y="9" width="6" height="18" rx="2" fill="#fff"/><rect x="9" y="15" width="18" height="6" rx="2" fill="#fff"/></svg>
        <div>
          <div class="app-title">ColOffline</div>
          <div class="app-subtitle" id="app-subtitle">Encuestas demográficas</div>
        </div>
      </div>
      <div class="app-header-actions">
        <span class="online-badge" id="online-badge" role="status">En línea</span>
        <button type="button" class="btn-salir" id="btn-salir" title="Cerrar sesión" aria-label="Cerrar sesión">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </header>

    <!-- Sesión vencida: se muestra fijo hasta volver a entrar. La cola no se toca. -->
    <div class="aviso-sesion hidden" id="aviso-sesion" role="alert">
      <span id="aviso-sesion-texto"></span>
      <button type="button" class="aviso-sesion-btn" id="aviso-sesion-btn">Iniciar sesión</button>
    </div>

    <main id="app-root"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-item" data-route="/personas">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1M16 4a4 4 0 0 1 0 8M22 21v-1a6 6 0 0 0-4-5.7"/></svg>
        <span>Personas</span>
      </button>
      <button class="nav-item nav-fab" data-route="/nueva" aria-label="Registrar persona">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Registrar</span>
      </button>
      <button class="nav-item" data-route="/sync">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 16.6A4.5 4.5 0 0 0 17.5 8h-1.3A7 7 0 1 0 4 15.3M12 12v9M8 15l4-4 4 4"/></svg>
        <span>Enviar</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script>
    const badge = document.getElementById('online-badge');
    function updateBadge() {
      badge.classList.toggle('offline', !navigator.onLine);
      badge.textContent = navigator.onLine ? 'En línea' : 'Sin conexión';
    }
    updateBadge();
    window.addEventListener('online', updateBadge);
    window.addEventListener('offline', updateBadge);
  </script>
</body>
</html>
